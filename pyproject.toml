[project]
name = "white-eyes-flask"
version = "0.1.0"
description = "White Eyes 분석 서버"
readme = "README.md"
authors = [
    { name = "Kanabig", email = "parkjungho20@gmail.com" }
]
requires-python = "==3.12.*"
dependencies = [
    "flask>=3.1.3",
    "python-dotenv>=1.0.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
]

[project.scripts]
white-eyes-flask = "white_eyes_flask:main"

[build-system]
requires = ["uv_build>=0.12.22,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
