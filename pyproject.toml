[project]
name = "white-eyes-flask"
version = "0.1.0"
description = "White Eyes 분석 서버"
readme = "README.md"
authors = [
    { name = "Kanabig", email = "parkjungho20@gmail.com" }
]
requires-python = "==3.12.*"
dependencies = [
    "flask>=3.1.3",
    "numpy>=2.5.4",
    "pandas>=3.0.6",
    "python-dotenv>=1.0.1",
    "scipy>=1.18.1",
    "seaborn>=0.13.2",
    "torch==2.6.0",
    "torchvision==0.21.0",
    "tqdm>=4.70.1",
    "ultralytics==8.4.183",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
]

[project.scripts]
white-eyes-flask = "white_eyes_flask:main"

[build-system]
requires = ["uv_build>=0.12.22,<0.13.0"]
build-backend = "uv_build"

[tool.uv.sources]
torch = { index = "pytorch-cpu", marker = "sys_platform == 'linux'" }
torchvision = { index = "pytorch-cpu", marker = "sys_platform == 'linux'" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
